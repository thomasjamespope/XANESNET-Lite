[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "XANESNET"
version = "0.1.0"
description = "Deep learning for theoretical simulation of spectra."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Pope" },
    { name = "Hendrik Junkawitsch" },
    { name = "Thomas Penfold" },
]
keywords = [
    "spectroscopy",
    "spectra prediction",
    "machine learning",
    "deep learning",
    "materials science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "lightning>=2.6.6",
    "numpy>=1.26,<3",
    "torch>=2.5,<3",
    "e3nn>=0.4.4",
]

[project.urls]
Homepage = "https://github.com/thomasjamespope/XANESNET/tree/lightning-training"
Documentation = "https://xanesnet.readthedocs.io"
Repository = "https://github.com/thomasjamespope/XANESNET/tree/lightning-training"

[project.scripts]
xanesnet = "xanesnet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xanesnet*"]
